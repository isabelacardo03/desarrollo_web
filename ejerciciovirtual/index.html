<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Ejercicios practicos html + css + js</h1>
    
    <div class="ejercicio">
        <h2>Ejercicio 1: Calculador IMC</h2>
        <p>Calcular el IMC usando variables y operadores. 
            FOMULA: IMC = peso / (altura) <sup>2</sup>
        </p>

        <div class="input-group">
            <label for="peso">Peso (kg): *</label>
            <input type="number" name="pesoImc" id="pesoImc" placeholder="00.0" 
            min="5" max="200" step="10" required value="">
        </div>
        <div class="input-group">
            <label for="altura">Altura (m): *</label>
            <input type="number" id="alturaImc" name="alturaImc" step="0.1" placeholder="0.00" 
            min="1" max="2.5" required value="">
        </div>
        <button>Calcular IMC</button>

        <div class="resultado" id="resultadoImc">
            <h3>Tu IMC es:</h3>
            <p id="valorImc"></p>
            <p id="categoriaImc"></p>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
